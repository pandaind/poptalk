version: '3.8'

services:
  backend:
    build: .
    container_name: poptalk-backend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-9097}:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      JWT_SECRET: ${JWT_SECRET}
      H2_PASSWORD: ${H2_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.3}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-150}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.3}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0.3}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1024}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_TEMPERATURE: ${MISTRAL_TEMPERATURE:-0.3}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.3}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      MCP_RAG_URL: ${MCP_RAG_URL:-}
      MCP_RAG_ENDPOINT: ${MCP_RAG_ENDPOINT:-/mcp}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_API_KEY: ${MCP_API_KEY:-}
      CHAT_MODE: ${CHAT_MODE:-AI}
      OWNER_NAME: ${OWNER_NAME:-PandaC}
      OWNER_WEBSITE_URL: ${OWNER_WEBSITE_URL:-}
      CHAT_TITLE: ${CHAT_TITLE:-Chat with Me}
      CHAT_AVATAR_INITIAL: ${CHAT_AVATAR_INITIAL:-P}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-https://pandac.in}
    volumes:
      # Persist H2 database on host (survives container rebuilds)
      - ./data:/app/data
      # Optional: override the context file without rebuilding the image
      # - ./data/context.txt:/app/data/context.txt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
