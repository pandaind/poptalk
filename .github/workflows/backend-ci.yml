name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
        env:
          # Minimal stubs so context-loading beans don't fail in CI
          H2_PASSWORD: ci_test_password
          JWT_SECRET: ci_jwt_secret_that_is_at_least_64_chars_long_for_hs256_validation
          TELEGRAM_BOT_TOKEN: stub
          TELEGRAM_ADMIN_CHAT_ID: "0"
          OLLAMA_API_KEY: ""

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
