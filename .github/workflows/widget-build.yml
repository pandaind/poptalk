name: Widget Build & Release

on:
  push:
    branches: [master, main]
    paths: ['widget/src/**']

jobs:
  build:
    name: Build widget and commit dist
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: widget

      - name: Build widget
        run: npm run build
        working-directory: widget

      - name: Commit updated dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add widget/dist/poptalk.min.js
          git diff --staged --quiet || git commit -m "chore: rebuild widget dist [skip ci]"
          git push
